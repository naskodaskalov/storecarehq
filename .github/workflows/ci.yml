name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - name: Row-level security test
        run: |
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -c "create database rls_test"
          psql -h localhost -U postgres -d rls_test -v ON_ERROR_STOP=1 -f supabase/tests/supabase-stub.sql -f supabase/migrations/20261027000001_init.sql
          psql -h localhost -U postgres -d rls_test -v ON_ERROR_STOP=1 -f supabase/tests/rls.test.sql
      - name: Build web app
        run: npm run build --workspace @storecare/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci
