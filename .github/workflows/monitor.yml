name: Monitor stores

# Every 30 minutes: uptime for every store, storefront snapshot when the last one is ~an hour old,
# checkout test and speed once a day after 06:00 store time, last month's reports drafted on the 1st. See apps/worker/src/tick.ts.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Also run now, even if not due (comma-separated: storefront, speed, site, report)'
        required: false
        default: ''

# Serialize manual, scheduled and externally dispatched passes. GitHub keeps only one pending run.
concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
      PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERTS_FROM: ${{ vars.ALERTS_FROM || 'StoreCare HQ <alerts@storecarehq.com>' }}
      # Optional: AI-written summaries for the reports drafted on the 1st (template summary without it).
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      APP_URL: https://storecarehq.vercel.app
      FORCE: ${{ inputs.force }}
    steps:
      # A monitoring job that cannot monitor must fail visibly.
      - name: Check secrets
        id: setup
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Monitoring cannot run: DATABASE_URL is missing from repository Actions secrets."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install worker
        if: steps.setup.outputs.ready == 'true'
        run: npm ci --workspace @storecare/worker --include-workspace-root=false --omit=dev --no-audit --no-fund

      - name: What is due
        id: due
        if: steps.setup.outputs.ready == 'true'
        working-directory: apps/worker
        run: |
          set -o pipefail
          node src/tick.ts --dry-run | tee due.txt
          if grep -q checkout due.txt; then echo "checkout=true" >> "$GITHUB_OUTPUT"; fi

      # Chromium is only needed for checkout tests, so it is installed (from cache) only then.
      - name: Cache browser
        if: steps.due.outputs.checkout == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install browser
        if: steps.due.outputs.checkout == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run checks
        if: steps.setup.outputs.ready == 'true'
        working-directory: apps/worker
        run: node src/tick.ts
